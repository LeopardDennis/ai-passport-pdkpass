<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDKPASS Wi-Fi Setup</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #17202a; background: #f4f4ea; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #0872c9; color: white; padding: 24px max(24px, calc((100vw - 432px) / 2)); }
    .brand { font-size: 29px; line-height: 1.15; letter-spacing: .01em; }
    .brand-sub { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; margin-top: 8px; color: #d6ecfa; }
    main { max-width: 480px; margin: auto; padding: 24px; }
    .status { display: flex; align-items: center; min-height: 50px; gap: 12px; padding: 10px 16px; border-radius: 13px; background: #e7f0dd; font-size: 16px; }
    .status-mark { display: block; width: 16px; height: 16px; flex: none; border-radius: 5px; background: #55931b; }
    h1 { margin: 24px 0 12px; font-size: clamp(24px, 6vw, 27px); line-height: 1.2; }
    .eyebrow { margin: 0 0 12px; color: #697b84; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
    .nearby { display: flex; flex-direction: column; max-height: 292px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; border: 2px solid #d1dadc; border-radius: 12px; background: white; }
    .nearby:empty { display: none; }
    .nearby .network { min-height: 48px; padding: 10px 14px; border: 0; border-bottom: 1px solid #d1dadc; border-radius: 0; font-size: 17px; }
    .nearby .network:last-child { border-bottom: 0; }
    .nearby .network:focus-visible { outline-offset: -3px; }
    #manual { min-height: 48px; padding: 10px 14px; font-size: 17px; }
    .network { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 65px; flex-shrink: 0; margin: 0; padding: 12px 16px; border: 2px solid #d1dadc; border-radius: 12px; background: white; color: #46545c; font: 21px system-ui, -apple-system, sans-serif; text-align: left; overflow-wrap: anywhere; }
    .network.selected { border-color: #17202a; background: #ffd928; color: #17202a; }
    .network:focus-visible, input:focus-visible, textarea:focus-visible, .connect:focus-visible { outline: 3px solid #0872c9; outline-offset: 2px; }
    .radio { width: 20px; height: 20px; flex: none; margin-left: 10px; border: 2px solid currentColor; border-radius: 50%; }
    .selected .radio::after { content: ""; display: block; width: 10px; height: 10px; margin: 3px; border-radius: 50%; background: currentColor; }
    .scan-note { margin: 0 0 12px; color: #697b84; font-size: 14px; }
    .scan-note[hidden], .manual-field[hidden] { display: none; }
    .nearby:not(:empty) { margin-bottom: 12px; }
    .manual-field, .password-field { display: block; margin: 24px 0 0; }
    .field-label { display: block; margin: 0 0 8px; font-size: 18px; }
    #ssid, #network-key { display: block; width: 100%; min-height: 59px; padding: 12px 16px; border: 2px solid #d1dadc; border-radius: 11px; background: white; color: #17202a; font: 20px system-ui, -apple-system, sans-serif; }
    .key-entry { position: relative; }
    #network-key, .key-mask { font: 20px/31px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow: hidden; }
    #network-key { height: 59px; resize: none; }
    #network-key.masked { color: transparent; -webkit-text-fill-color: transparent; caret-color: #17202a; }
    .key-mask { position: absolute; inset: 2px; padding: 12px 16px; pointer-events: none; }
    .key-visibility { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; }
    .key-visibility input { width: 16px; height: 16px; margin: 0; }
    .error { margin: 12px 0 0; color: #b5261f; font-size: 14px; }
    .error:empty { display: none; }
    .connect { width: 100%; min-height: 67px; margin-top: 24px; border: 3px solid #17202a; border-radius: 10px; background: #ffd928; color: #17202a; font: 700 22px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .connect:disabled { opacity: .55; }
    .connect:active { transform: translateY(1px); }
    @media (max-width: 360px) { main { padding-left: 16px; padding-right: 16px; } .network { font-size: 19px; } }
  </style>
</head>
<body>
  <header><div class="brand">PDKPASS</div><div class="brand-sub">WI-FI SETUP</div></header>
  <main>
    <div class="status"><span class="status-mark" aria-hidden="true"></span>Connected to device hotspot</div>
    <h1>Select a 2.4 GHz Network</h1>
    <p class="eyebrow">NEARBY NETWORKS</p>
    <div id="setup-controls">
      <div id="nearby" class="nearby" role="group" aria-label="Nearby networks"></div>
      <p id="scan-note" class="scan-note" role="status">Scanning nearby networks...</p>
      <button id="manual" class="network selected" type="button" aria-pressed="true"><span>Enter Network Manually</span><span class="radio" aria-hidden="true"></span></button>
      <label id="manual-field" class="manual-field"><span class="field-label">Network Name</span><input id="ssid" maxlength="32" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go"></label>
      <div class="password-field">
        <label class="field-label" for="network-key">Wi-Fi Password</label>
        <div class="key-entry">
          <textarea id="network-key" class="masked" rows="1" maxlength="63" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" disabled></textarea>
          <span id="key-mask" class="key-mask" aria-hidden="true"></span>
        </div>
        <label class="key-visibility"><input id="show-key" type="checkbox" disabled>Show password</label>
      </div>
      <p id="error" class="error" role="alert"></p>
      <button id="connect" class="connect" type="button" disabled>Connect</button>
    </div>
  </main>
  <script>
    const nearby = document.getElementById('nearby');
    const note = document.getElementById('scan-note');
    const manual = document.getElementById('manual');
    const manualField = document.getElementById('manual-field');
    const ssid = document.getElementById('ssid');
    const password = document.getElementById('network-key');
    const mask = document.getElementById('key-mask');
    const reveal = document.getElementById('show-key');
    const connect = document.getElementById('connect');
    const error = document.getElementById('error');
    const controls = document.getElementById('setup-controls');
    let manualTouched = false;
    let submitting = false;

    // Mask the ordinary editor visually while keeping its value available to POST.
    function updateMask() {
      password.classList.toggle('masked', !reveal.checked);
      mask.hidden = reveal.checked;
      mask.textContent = '•'.repeat(Array.from(password.value).length);
      mask.scrollLeft = password.scrollLeft;
    }

    function clearPassword() {
      password.value = '';
      reveal.checked = false;
      updateMask();
    }

    function select(button, name) {
      for (const row of document.querySelectorAll('.network')) {
        const active = row === button;
        row.classList.toggle('selected', active);
        row.setAttribute('aria-pressed', String(active));
      }
      const isManual = button === manual;
      manualField.hidden = !isManual;
      if (ssid.value !== name) clearPassword();
      ssid.value = name;
      error.textContent = '';
      if (isManual) ssid.focus();
    }
    manual.addEventListener('click', () => { manualTouched = true; select(manual, ''); });
    ssid.addEventListener('input', () => { manualTouched = true; clearPassword(); });
    password.addEventListener('input', event => {
      if (!event.isComposing) {
        const singleLine = password.value.replace(/[\r\n]/g, '');
        if (password.value !== singleLine) password.value = singleLine;
      }
      updateMask();
    });
    password.addEventListener('scroll', () => { mask.scrollLeft = password.scrollLeft; });
    reveal.addEventListener('change', updateMask);
    for (const event of ['copy', 'cut']) {
      password.addEventListener(event, action => {
        if (!reveal.checked) action.preventDefault();
      });
    }

    fetch('/networks', { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error('scan'); return response.json(); })
      .then(result => {
        const names = Array.isArray(result.networks) ? result.networks.filter(name => typeof name === 'string' && name) : [];
        note.hidden = names.length > 0;
        if (!names.length) note.textContent = result.scanFailed ? 'Nearby network scan unavailable.' : 'No nearby networks found.';
        names.forEach((name, index) => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'network';
          row.setAttribute('aria-pressed', 'false');
          const title = document.createElement('span');
          title.textContent = name;
          const radio = document.createElement('span');
          radio.className = 'radio';
          radio.setAttribute('aria-hidden', 'true');
          row.append(title, radio);
          row.addEventListener('click', () => select(row, name));
          nearby.append(row);
          row.disabled = submitting;
          if (index === 0 && !manualTouched && !submitting) select(row, name);
        });
      })
      .catch(() => { note.textContent = 'Nearby network scan unavailable.'; });

    // FMO submits the edited values with JavaScript and keeps the page open on errors.
    async function submit() {
      if (submitting) return;
      const length = value => new TextEncoder().encode(value).length;
      const nameLength = length(ssid.value);
      const passwordLength = length(password.value);
      if (nameLength < 1 || nameLength > 32 ||
          (passwordLength !== 0 && (passwordLength < 8 || passwordLength > 63))) {
        error.textContent = 'Check the Network Name and Wi-Fi Password.';
        return;
      }
      const body = new URLSearchParams({ ssid: ssid.value, password: password.value });
      submitting = true;
      error.textContent = '';
      controls.setAttribute('aria-busy', 'true');
      for (const control of controls.querySelectorAll('input, textarea, button')) control.disabled = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch('/save', {
          method: 'POST', body, cache: 'no-store', signal: controller.signal
        });
        if (response.status !== 202) {
          error.textContent = response.status === 409
            ? 'A connection is already being tested. Check the device screen.'
            : 'Could not submit. Check your input and try again.';
          return;
        }
        // Reuse the server's existing connecting page without a native form navigation.
        const statusPage = new DOMParser().parseFromString(await response.text(), 'text/html');
        const main = statusPage.querySelector('main');
        const style = statusPage.querySelector('style');
        if (!main || !style) throw new Error('Invalid status page');
        clearPassword();
        document.querySelector('style').replaceWith(style);
        document.querySelector('main').replaceWith(main);
        window.scrollTo(0, 0);
      } catch (_) {
        error.textContent = 'Submission interrupted. Check the device screen before retrying.';
      } finally {
        clearTimeout(timeout);
        if (controls.isConnected) {
          submitting = false;
          controls.removeAttribute('aria-busy');
          for (const control of controls.querySelectorAll('input, textarea, button')) control.disabled = false;
        }
      }
    }
    connect.addEventListener('click', submit);
    password.addEventListener('beforeinput', event => {
      if (event.isComposing || !['insertLineBreak', 'insertParagraph'].includes(event.inputType)) return;
      event.preventDefault();
      submit();
    });
    for (const field of [ssid, password]) {
      field.addEventListener('keydown', event => {
        if (event.key !== 'Enter' || event.isComposing) return;
        event.preventDefault();
        submit();
      });
    }
    password.disabled = reveal.disabled = connect.disabled = false;
  </script>
</body>
</html>
