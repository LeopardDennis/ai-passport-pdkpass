<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDKPASS Wi-Fi Setup</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #17202a; background: #f4f4ea; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #0872c9; color: white; padding: 24px max(24px, calc((100vw - 432px) / 2)); }
    .brand { font-size: 29px; line-height: 1.15; }
    .brand-sub { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; margin-top: 8px; color: #d6ecfa; }
    main { max-width: 480px; margin: auto; padding: 48px 24px; }
    h1 { margin: 0 0 20px; font-size: 27px; }
    p { font-size: 17px; line-height: 1.5; }
    .status { display: inline-block; padding: 10px 14px; border-radius: 10px; background: #ffd928; font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <header><div class="brand">PDKPASS</div><div class="brand-sub">WI-FI SETUP</div></header>
  <main><div class="status">CONNECTING</div><h1>Testing Wi-Fi...</h1>
    <p>Check the PDKPASS screen for the result. If setup remains visible, reconnect to the device hotspot and check the password.</p>
  </main>
</body>
</html>
